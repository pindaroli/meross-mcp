services:
  meross-gateway:
    build: .
    image: ghcr.io/pindaroli/meross-mcp:0.1.2
    container_name: meross-gateway
    restart: unless-stopped
    ports:
      - "8112:8112"
    env_file:
      - .env
    environment:
      - MEROSS_EMAIL=${MEROSS_EMAIL}
      - MEROSS_PASSWORD=${MEROSS_PASSWORD}
      - MEROSS_API_BASE_URL=${MEROSS_API_BASE_URL:-https://iotx-eu.meross.com}
      - MEROSS_GATEWAY_HOST=0.0.0.0
      - MEROSS_GATEWAY_PORT=8112
      - MEROSS_GATEWAY_API_KEY=${MEROSS_GATEWAY_API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8112/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
